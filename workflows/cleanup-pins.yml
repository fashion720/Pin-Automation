name: Cleanup published pin images

# Runs daily Oct 15-20 at 17:00 UTC (22:00 PKT) - after that day's pins
# have published - and deletes each hosted pin image whose publish date
# has passed. Pinterest keeps its own copy of every pin image from the
# CSV import, so deleting the source files does not affect the pins.

on:
  schedule:
    - cron: "0 17 15-20 10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete images whose publish date has passed
        run: |
          today=$(date -u +%F)
          changed=0
          tail -n +2 pinterest-pins-manifest.csv | while IFS=, read -r path pdate; do
            if [ "$pdate" \< "$today" ] || [ "$pdate" = "$today" ]; then
              if [ -f "$path" ]; then
                rm "$path"
                echo "deleted $path (published $pdate)"
              fi
            fi
          done
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to delete today"
          else
            git config user.name "pin-cleanup"
            git config user.email "actions@github.com"
            git commit -m "Cleanup: remove hosted images of published pins"
            git push
          fi
